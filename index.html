<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de Vida</title>
<meta name="theme-color" content="#0a100d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<!-- Sin devtools en el celular, un error de JS es invisible. Este cartel lo muestra. -->
<div class="fatal oculto" id="fatal"></div>

<header class="top">
  <div>
    <h1>Panel de Vida</h1>
    <button class="fecha" id="fecha" title="Ver diagnóstico"></button>
  </div>
  <span class="pulso" id="pulso" aria-hidden="true"></span>
</header>

<main id="main"></main>

<nav class="sectores" aria-label="Secciones">
  <a class="sector" href="#/hoy" data-r="hoy"><span class="emo">🗓️</span>Hoy</a>
  <a class="sector" href="#/cultivo" data-r="cultivo"><span class="emo">🌱</span>Cultivo</a>
  <a class="sector" href="#/rumbo" data-r="rumbo"><span class="emo">🧭</span>Rumbo</a>
</nav>

<!-- Tarjetas que se mueven a <main> según haga falta. Viven acá para que sus
     manejadores de eventos se enganchen una sola vez, al arrancar. -->
<div id="deposito" hidden>

  <section class="card" id="card-login">
    <h2 id="login-titulo">Sin conexión con Google</h2>
    <p class="muted" id="login-texto">
      El panel lee la agenda, el correo y los archivos de tu cuenta.
      No guarda nada en ningún servidor propio.
    </p>
    <button class="btn" id="btn-conectar">Conectar con Google</button>
    <p class="nota oculto" id="login-error"></p>
  </section>

  <section class="bloque" id="card-diag">
    <h2 class="titulo">Diagnóstico</h2>
    <ul class="chequeos">
      <li data-k="sesion"><span class="ico">·</span><span class="txt">Sesión</span><span class="det"></span></li>
      <li data-k="modo"><span class="ico">·</span><span class="txt">Modo</span><span class="det"></span></li>
      <li data-k="sw"><span class="ico">·</span><span class="txt">Service worker</span><span class="det"></span></li>
      <li data-k="instalable"><span class="ico">·</span><span class="txt">Instalable</span><span class="det"></span></li>
    </ul>
    <p class="nota" id="sesion-info"></p>
    <button class="btn oculto" id="btn-instalar">Instalar en la pantalla de inicio</button>
    <div class="acciones">
      <button class="btn btn-sec" id="btn-volver">Volver</button>
      <button class="btn btn-sec" id="btn-salir">Cerrar sesión</button>
    </div>
  </section>

</div>

<script type="module" src="./js/app.js"></script>
<script nomodule>
  var f = document.getElementById('fatal');
  f.textContent = 'Este navegador no soporta módulos de JavaScript. La app necesita uno más nuevo.';
  f.classList.remove('oculto');
</script>
</body>
</html>
